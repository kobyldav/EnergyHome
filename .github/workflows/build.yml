name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run backend and synchronization tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -v
          node --check static/app.js
          node --check static/insights.js
          node --check static/monthly.js
          node --check static/debug.js
          node --check static/i18n.js
          node tests/frontend_smoke.cjs
          node tests/monthly_frontend_smoke.cjs
          node tests/debug_frontend_smoke.cjs

      - name: Build Energy Home with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean EnergyHome.spec
          if (!(Test-Path "dist\EnergyHome\EnergyHome.exe")) {
            throw "EnergyHome.exe was not created."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }

          if (-not $iscc) {
            throw "ISCC.exe was not found."
          }

          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }

          $setup = Get-ChildItem "release\EnergyHome-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Installer was not created."
          }

          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -LiteralPath ($setup.FullName + ".sha256.txt") -Encoding ascii

      - name: Upload unsigned Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyHome-windows-unsigned
          path: |
            release/EnergyHome-*-Setup.exe
            release/EnergyHome-*-Setup.exe.sha256.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-windows
    if: github.repository == 'kobyldav/EnergyHome' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: energyhome-publish-release
      cancel-in-progress: false
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v5
      - name: Download tested installer
        uses: actions/download-artifact@v4
        with:
          name: EnergyHome-windows-unsigned
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^APP_VERSION = "\([0-9][0-9.]*\)"/\1/p' app.py)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          setup="EnergyHome-$version-Setup.exe"
          notes="release-notes/$version.md"
          # Only explicitly prepared versions may be published.
          if [[ ! -f "$notes" ]]; then
            echo "No release notes for $tag; skipping."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; never replace published installers."
            exit 0
          fi
          # A pre-existing tag must identify exactly the tested commit.
          if tag_sha="$(git ls-remote origin "refs/tags/$tag^{}" "refs/tags/$tag" | awk 'NR==1{print $1}')" && [[ -n "$tag_sha" ]]; then
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo "Tag points to another commit"; exit 1; }
          fi
          grep -Fq "#define MyAppVersion \"$version\"" installer.iss
          test -f "release/$setup"
          test -f "release/$setup.sha256.txt"
          (cd release && sha256sum --check "$setup.sha256.txt")
          gh release create "$tag" "release/$setup" "release/$setup.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Energy Home $version" --notes-file "$notes"
