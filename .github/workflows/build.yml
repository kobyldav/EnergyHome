name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Energy Home with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean EnergyHome.spec
          if (!(Test-Path "dist\EnergyHome\EnergyHome.exe")) {
            throw "EnergyHome.exe was not created."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }

          if (-not $iscc) {
            throw "ISCC.exe was not found."
          }

          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }

          $setup = Get-ChildItem "release\EnergyHome-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Installer was not created."
          }

          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -LiteralPath ($setup.FullName + ".sha256.txt") -Encoding ascii

      - name: Upload unsigned Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyHome-windows-unsigned
          path: |
            release/EnergyHome-*-Setup.exe
            release/EnergyHome-*-Setup.exe.sha256.txt
          if-no-files-found: error
          retention-days: 14
